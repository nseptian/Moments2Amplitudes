# Moments2Amplitudes Configuration: Two Breit-Wigners with Blatt-Weisskopf Barrier Factors
# Model: Coupled D-wave: a2(1320) + fixed a2(1700) with Blatt-Weisskopf barrier factors (L=2) and kinematic factor sqrt(rho_etapi)
# Formalism:
#   A_2BW(m) = sqrt(rho_etapi(m)) * [ BarrierBW(k1, M1, W1, L=2) * exp(i*phase1) + BarrierBW(k2, M2, W2, L=2) * exp(i*phase2) ]

project:
  name: "a2CS_published_model_Barrier"
  description: "Fit two coherent D-wave states: a2(1320) + a2(1700) with Blatt-Weisskopf barrier factor (L=2) and kinematic factor"

dataset:
  moments_dir: "/d/grid17/septian/EtaPi0Analysis/run/MomentFit_m080200_FixedCov_Lmax4_InitValueScale1.0_step0.8"
  tbins: ["t010020", "t020032", "t032050", "t050075", "t075100"]
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: ""
  mass_bins:
    min: 1.06
    max: 1.74
    step: 0.04
  use_covariance: true

chi2:
  included_L: [0, 2, 4]
  max_l: 4

waves:
  # L = 0: S-wave piecewise
  - l: 0
    name: "S-wave"
    type: "piecewise"
    init:
      strategy: "random"
      magnitude:
        strategy: "random"
        min: 0.0
        max: 200.0
      phase:
        strategy: "fixed"
        value: 0.0
        fixed: false

  # L = 1: P-wave fixed to zero
  - l: 1
    name: "P-wave"
    type: "piecewise"
    init:
      fixed_zero: true

  # L = 2: D-wave two Breit-Wigners with Blatt-Weisskopf barrier factors
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "barrier_two_breit_wigner"
    barrier: true
    barrier_l: 2
    barrier_radius: 5.0677
    formula: "sqrt(rho_etapi) * (barrier_bw_etapi(k1, Mass1, Width1, 2) * exp(i * phase1) + barrier_bw_etapi(k2, Mass2, Width2, 2) * exp(i * phase2))"
    parameters: ["k1", "Mass1", "Width1", "phase1", "k2", "Mass2", "Width2", "phase2"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.107
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
        phase: 0.0
        phase_fixed: true
        shared_phase: true
      - name: "a2_1700"
        mass: 1.706
        width: 0.380
        mass_fixed: true
        width_fixed: true
        mass_limits: [1.55, 1.85]
        width_limits: [0.25, 0.50]
        phase: 0.0
        phase_fixed: false
        shared_phase: true
    init:
      strategy: "random"
      option: 2
      shared_phase: true

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-2
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 100
  n_tbin_workers: 5
  output_dir: "logs_a2CS_published_barrier"

mcmc_propagation:
  enabled: true
  n_samples: 50000
  burn_in: 5000
  stride: 5
  output_dir: "logs_a2CS_published_barrier"

cross_section:
  enabled: true
  resonance: "a2_1320"
  branching_ratio: 0.0565
  luminosity: 257.4
  luminosity_unit: "pb^-1"
  has_kinematic: true
  has_barrier: true
  barrier_l: 2
  barrier_radius: 5.0677
  propagate_mcmc: true

plotting:
  enabled: true
  output_dir: "plots_a2CS_published_barrier"
