# Moments2Amplitudes Configuration: Two Breit-Wigners Fit
# Model: Coherent sum of two D-wave resonances: a2(1320) + a2(1700)
# Includes explicit analytical formula for interference between the two states.

project:
  name: "EtaPi0_DTwoBreitWigner"
  description: "Fit two coherent D-wave Breit-Wigner states: a2(1320) + a2(1700) using H4 moment"

dataset:
  moments_dir: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal"
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: "t010030"
  mass_bins:
    min: 1.04
    max: 1.88
    step: 0.04
  use_covariance: true

chi2:
  included_l: [4]
  excluded_l: []
  max_l: 4

waves:
  # L = 1: P-wave fixed to zero
  - l: 1
    name: "P-wave"
    type: "piecewise"
    init:
      fixed_zero: true

  # L = 2: Two Breit-Wigners (a2_1320 + a2_1700) with explicit formula
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "two_breit_wigner"
    formula: "k1 / (Mass1^2 - s - i * Mass1 * Width1) + (k2 / (Mass2^2 - s - i * Mass2 * Width2)) * exp(i * phase)"
    parameters: ["k1", "Mass1", "Width1", "k2", "Mass2", "Width2", "phase"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.105
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.40]
        width_limits: [0.05, 0.20]
      - name: "a2_1700"
        mass: 1.700
        width: 0.250
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.55, 1.85]
        width_limits: [0.10, 0.40]
    init:
      strategy: "random"
      option: 1  # Add shared relative phase

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-3
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 8
  output_dir: "logs_twobw"
  plateau_delta_chi2: 0.05
  seed_offset: 1

mcmc_propagation:
  enabled: false
  mcmc_tree_path: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal/Mpi0eta1.320000_t010030_/ResultsBruMcmcFixedCovariance.root"
  burn_in: 0
  max_entries: 200
  stride: 1
  n_workers: 8
  output_file: "mcmc_propagation_twobw_results.root"
  log_dir: "logs_twobw/mcmc_fits"

