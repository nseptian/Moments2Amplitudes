# Moments2Amplitudes Configuration: S-wave Flatté + D-wave Breit-Wigner
# Model: S-wave a0(980) coupled-channel Flatté + D-wave a2(1320) Breit-Wigner
# Both waves use explicit mass-dependent formulas declared directly in YAML.

project:
  name: "EtaPi0_SFlatte_DBreitWigner"
  description: "Fit S-wave a0(980) Flatté and D-wave a2(1320) Breit-Wigner using H0, H2, H4 moments"

dataset:
  moments_dir: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal"
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: "t010030"
  mass_bins:
    min: 0.82
    max: 1.62
    step: 0.04
  use_covariance: true

chi2:
  included_L: [0, 2, 4]
  max_l: 4

waves:
  # L = 0: S-wave Flatté with explicit coupled-channel formula
  - l: 0
    name: "S-wave"
    type: "mass_dependent"
    model: "flatte"
    formula: "k / (Mass^2 - s - i * (g_etapi^2 * rho_etapi + g_KK^2 * rho_KK + g_etaprimepi^2 * rho_etaprimepi)) * exp(i * phase)"
    parameters: ["k", "Mass", "g_etapi", "g_KK", "g_etaprimepi", "phase"]
    poly_order: -1
    resonances:
      - name: "a0_980"
        mass: 0.980
        mass_fixed: true
        g_etapi: 0.5          # Flatté coupling g_etapi (g_s)
        g_etapi_fixed: false
        g_KK: -99.0          # Coupling to K-Kbar (-99.0 uses CBAR ratio)
        g_KK_fixed: true
        g_etaprimepi: -99.0  # Coupling to eta'-pi (-99.0 uses CBAR ratio)
        g_etaprimepi_fixed: true
        shared_phase: true  # Shared global phase per reflectivity
    init:
      strategy: "random"

  # L = 1: P-wave fixed to zero
  - l: 1
    name: "P-wave"
    type: "piecewise"
    init:
      fixed_zero: true

  # L = 2: D-wave Breit-Wigner with explicit formula
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "breit_wigner"
    formula: "k / (M^2 - s - i * M * width)"
    parameters: ["k", "M", "width"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.105
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
    init:
      strategy: "from_file"
      file_path: "/d/grid17/septian/Moments2Amplitudes/run/MassDependentResults_0.root"

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-3
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 8
  output_dir: "logs_sflatte"
  plateau_delta_chi2: 0.05
  seed_offset: 1

mcmc_propagation:
  enabled: false
  mcmc_tree_path: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal/Mpi0eta1.320000_t010030_/ResultsBruMcmcFixedCovariance.root"
  burn_in: 0
  target_entries: 200
  n_workers: 8
  output_file: "mcmc_propagation_sflatte_results.root"
  log_dir: "logs_sflatte/mcmc_fits"

