# Moments2Amplitudes Configuration: Realistic D-wave Resonance Fit
# Model: D-wave Breit-Wigner a2(1320) multiplied by kinematic phase space factor sqrt(rho_etapi)
# Reference: V. Mathieu et al. (JPAC Collaboration), Phys. Rev. D 100, 054017 (2019),
#            Eq. (10) and Footnote 6 / Eq. (A4): T_hat = sqrt(rho_etapi) * Delta_R(m_etapi)
#            ensuring the amplitude vanishes smoothly at the eta-pi0 threshold.

project:
  name: "a2CS_DBreitWigner_Kinematic"
  description: "Fit D-wave a2(1320) with realistic kinematic phase-space factor multiplied by Breit-Wigner (JPAC PRD 100, 054017)"

dataset:
  moments_dir: "/d/grid17/septian/EtaPi0Analysis/run/MomentFit_m080200_FixedCov_Lmax4_InitValueScale1.0_step0.8"
  tbins: ["t010020", "t020032", "t032050", "t050075", "t075100"]  # Runnable in parallel across t-bins
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: ""
  mass_bins:
    min: 1.06
    max: 1.58
    step: 0.04
  use_covariance: true

chi2:
  included_l: [4]
  excluded_l: []
  max_l: 4

waves:
  # L = 2: D-wave Breit-Wigner multiplied by realistic kinematic factor sqrt(rho_etapi)
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "breit_wigner"
    formula: "sqrt(rho_etapi) * k / (M^2 - s - i * M * width)"
    parameters: ["k", "M", "width"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.107
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
    init:
      strategy: "random"
      option: 0

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-2
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 100
  n_tbin_workers: 5
  output_dir: "logs_a2CS_dbw_kinematic"
  plateau_delta_chi2: 0.05
  seed_offset: 1

mcmc_propagation:
  enabled: false
  mcmc_tree_path: "/d/grid17/septian/EtaPi0Analysis/run/MomentFit_m080200_FixedCov_Lmax4_InitValueScale1.0_step0.8/{tbin}/Mpi0eta1.300000_/ResultsBruMcmcFixedCovariance.root"
  burn_in: 0
  max_entries: 1000
  stride: 1
  n_workers: 8
  n_tbin_workers: 5
  output_file: "mcmc_propagation_dbw_kinematic_results.root"
  log_dir: "logs_a2CS_dbw_kinematic/mcmc_fits"

plotting:
  enabled: true
  style: "default"
  n_lowest_chi2: 10
  draw_best_fits: true
  moments: ["all"]
  formats: ["pdf"]

cross_section:
  enabled: false
  resonance: "a2_1320"
  branching_ratio: 0.0565
  luminosity: 257.4
  luminosity_unit: "pb^-1"
  t_min: 0.1
  t_max: 0.2
  mass_limits: [0.8, 2.0]
  phase1_comparison: true
