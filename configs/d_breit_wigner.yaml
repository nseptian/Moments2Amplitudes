# Moments2Amplitudes Configuration: Stage 1 D-wave Breit-Wigner Fit
# Fits D-wave resonance a2(1320) using H4 moment with covariance matrix.

project:
  name: "EtaPi0_DBreitWigner_Stage1"
  description: "Fit D-wave a2(1320) resonance parameters using H4 moments"

environment:
  brufit_dir: "${BRUFIT:-/d/grid17/septian/brufit_dev/brufit}"
  root_dir: "${ROOTSYS:-}"

dataset:
  moments_dir: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal"
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: "t010030"
  mass_bins:
    min: 1.04
    max: 1.72
    step: 0.04
  use_covariance: true

chi2:
  included_l: [4]
  excluded_l: []
  max_l: 4

waves:
  # L = 0: S-wave not included in H4-only fit
  # L = 1: P-wave fixed to zero
  - l: 1
    name: "P-wave"
    type: "piecewise"
    init:
      fixed_zero: true

  # L = 2: D-wave Breit-Wigner
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "breit_wigner"
    formula: "k / (M^2 - s - i * M * width)"
    parameters: ["k", "M", "width"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.105
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
    init:
      strategy: "random"
      option: 0

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-3
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 8
  output_dir: "logs_dbw"
  plateau_delta_chi2: 0.05
  seed_offset: 1

mcmc_propagation:
  enabled: false
  mcmc_tree_path: "/d/grid17/septian/Moments2Amplitudes/Moments.out/nominal/Mpi0eta1.320000_t010030_/ResultsBruMcmcFixedCovariance.root"
  burn_in: 0
  max_entries: 200
  stride: 1
  n_workers: 8
  output_file: "mcmc_propagation_dbw_results.root"
  log_dir: "logs_dbw/mcmc_fits"

