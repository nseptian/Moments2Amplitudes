# Moments2Amplitudes Configuration: S-, P-, and D-Wave Combined Model Fit with Blatt-Weisskopf Barrier Factors
# Waves:
#   - L = 0: S-wave with coupled-channel a0(980) Flatté + order-2 conformal polynomial (non-resonant background)
#   - L = 1: P-wave with 1 Barrier Breit-Wigner for pi1(1600) (L=1 centrifugal barrier)
#   - L = 2: D-wave with Two Barrier Breit-Wigners for a2(1320) + a2(1700) (L=2 centrifugal barrier)
# Mass range: 0.86 - 1.78 GeV spanning a0(980), a2(1320), pi1(1600), and a2(1700)

project:
  name: "a2CS_SFlattePoly_PBreitWigner_DTwoBreitWigner_Barrier"
  tag: "s_flatte_poly_p_bw_d_two_bw_barrier"
  description: "S-wave (a0(980) Flatté + poly order 2 for non-resonant S-wave physics) + P-wave (pi1(1600) Barrier Breit-Wigner L=1) + D-wave (a2(1320) + a2(1700) Two Barrier Breit-Wigners L=2)"

dataset:
  moments_dir: "/d/grid17/septian/EtaPi0Analysis/run/MomentFit_m080200_FixedCov_Lmax4_InitValueScale1.0_step0.8"
  tbins: ["t010020", "t020032", "t032050", "t050075", "t075100"]  # Runnable in parallel across t-bins
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: ""
  mass_bins:
    min: 0.86
    max: 1.78
    step: 0.04
  use_covariance: true

chi2:
  included_L: [0, 1, 2, 3, 4]  # S, P, D self and interference moments up to L=4
  max_l: 4

waves:
  # L = 0: S-wave Flatté for a0(980) + order-2 conformal polynomial for non-resonant S-wave physics
  - l: 0
    name: "S-wave"
    type: "mass_dependent"
    model: "flatte"
    formula: "k / (Mass^2 - s - i * (g_etapi^2 * rho_etapi + g_KK^2 * rho_KK + g_etaprimepi^2 * rho_etaprimepi)) * exp(i * phase)"
    parameters: ["k", "Mass", "g_etapi", "g_KK", "g_etaprimepi", "phase"]
    poly_order: 2
    resonances:
      - name: "a0_980"
        mass: 0.980
        mass_fixed: false
        mass_limits: [0.90, 1.05]
        g_etapi: 0.5            # Flatté coupling g_etapi (g_s)
        g_etapi_fixed: false
        g_etapi_limits: [0.1, 1.5]
        g_KK: -99.0            # Coupling to K-Kbar (-99.0 uses CBAR ratio)
        g_KK_fixed: true
        g_KK_limits: [0.0, 2.0]
        g_etaprimepi: -99.0    # Coupling to eta'-pi (-99.0 uses CBAR ratio)
        g_etaprimepi_fixed: true
        g_etaprimepi_limits: [0.0, 2.0]
        phase: 0.0
        phase_fixed: false     # Floating relative phase
        shared_phase: true    # Shared phase among waves in the same reflectivity
    init:
      strategy: "random"

  # L = 1: P-wave Barrier Breit-Wigner for pi1(1600) (L=1)
  - l: 1
    name: "P-wave"
    type: "mass_dependent"
    model: "barrier_breit_wigner"
    barrier_l: 1
    barrier_radius: 5.0677
    formula: "barrier_bw_etapi(k, Mass, Width, 1)"
    parameters: ["k", "Mass", "Width"]
    poly_order: -1
    resonances:
      - name: "pi1_1600"
        mass: 1.600
        width: 0.300
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.40, 1.80]
        width_limits: [0.10, 0.60]
        phase: 0.0
        phase_fixed: false     # Floating relative phase
        shared_phase: true    # Shared phase among waves in the same reflectivity
    init:
      strategy: "random"

  # L = 2: D-wave two Barrier Breit-Wigners: a2(1320) + a2(1700) (L=2)
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "barrier_two_breit_wigner"
    barrier_l: 2
    barrier_radius: 5.0677
    formula: "barrier_bw_etapi(k1, Mass1, Width1, 2) * exp(i * phase1) + barrier_bw_etapi(k2, Mass2, Width2, 2) * exp(i * phase2)"
    parameters: ["k1", "Mass1", "Width1", "phase1", "k2", "Mass2", "Width2", "phase2"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.107
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
        phase: 0.0
        phase_fixed: true      # General phase reference fixed to 0.0
        shared_phase: true     # Shared phase among waves in the same reflectivity
      - name: "a2_1700"
        mass: 1.706
        width: 0.380
        mass_fixed: true       # Standard reference fixed parameters
        width_fixed: true
        mass_limits: [1.55, 1.85]
        width_limits: [0.10, 0.40]
        phase: 0.0
        phase_fixed: false     # Floating relative phase
        shared_phase: true     # Shared phase among waves in the same reflectivity
    init:
      strategy: "random"

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-3
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 5000
  n_threads: 50
  n_tbin_workers: 5
  output_dir: "logs_a2CS_SFlattePoly_PBreitWigner_DTwoBreitWigner_Barrier"
  plateau_delta_chi2: 0.1
  seed_offset: 1

mcmc_propagation:
  enabled: false
  burn_in: 0
  target_entries: 200
  n_workers: 8
  n_tbin_workers: 5
  output_file: "mcmc_propagation_sflattepoly_pbreitwigner_dtwobreitwigner_barrier_results.root"
  log_dir: "logs_a2CS_SFlattePoly_PBreitWigner_DTwoBreitWigner_Barrier/mcmc_fits"

plotting:
  enabled: true
  style: "default"
  moments_vs_t: true
  moments_vs_t_sharey: false
  amplitudes_vs_t: true
  amplitudes_vs_t_sharey: false
  distributions: true

cross_section:
  enabled: true
  resonance: "a2_1320"
  branching_ratio: 0.0565
  luminosity: 257.4
  luminosity_unit: "pb^-1"
  mass_limits: [0.86, 1.78]
  has_barrier: true
  barrier_l: 2
  barrier_radius: 5.0677
  phase1_comparison: true
  propagate_mcmc: true
