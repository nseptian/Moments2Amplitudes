# Moments2Amplitudes Configuration: Stage 2 S-Piecewise + D-BreitWigner Kinematic Fit
# Fits Piecewise S-wave (random magnitude in [0, 200], zero phase)
# with D-wave modeled by realistic Breit-Wigner with kinematic factor sqrt(rho_etapi)
# initialized from prior D-wave fit (logs_a2CS_dbw_kinematic), and propagates MCMC uncertainty.
# Reference: V. Mathieu et al. (JPAC Collaboration), Phys. Rev. D 100, 054017 (2019).

project:
  name: "EtaPi0_SPiecewise_DBreitWigner_Kinematic_Stage2"
  description: "Two-stage fit: Piecewise S-waves + D-wave Breit-Wigner with kinematic factor sqrt(rho_etapi) and full MCMC covariance propagation"

dataset:
  moments_dir: "/d/grid17/septian/EtaPi0Analysis/run/MomentFit_m080200_FixedCov_Lmax4_InitValueScale1.0_step0.8"
  tbins: ["t010020", "t020032", "t032050", "t050075", "t075100"]  # Runnable in parallel across t-bins
  results_filename: "ResultsBruMcmcFixedCovariance.root"
  bin_prefix: "Mpi0eta"
  var_bin_prefix: ""
  mass_bins:
    min: 1.06
    max: 1.58
    step: 0.04
  use_covariance: true

chi2:
  included_l: [0, 2, 4]
  excluded_l: []
  max_l: 4

waves:
  # L = 0: Piecewise S-wave (per mass bin: random positive magnitude in [0, 200], phase fixed to 0)
  - l: 0
    name: "S-wave"
    type: "piecewise"
    init:
      strategy: "random"
      magnitude:
        strategy: "random"
        min: 0.0
        max: 200.0
      phase:
        strategy: "fixed"
        value: 0.0
        fixed: false

  # L = 1: P-wave fixed to 0
  - l: 1
    name: "P-wave"
    type: "piecewise"
    init:
      fixed_zero: true

  # L = 2: D-wave Breit-Wigner with kinematic factor initialized from prior D-wave fit
  - l: 2
    name: "D-wave"
    type: "mass_dependent"
    model: "breit_wigner"
    formula: "sqrt(rho_etapi) * k / (M^2 - s - i * M * width)"
    parameters: ["k", "M", "width"]
    poly_order: -1
    resonances:
      - name: "a2_1320"
        mass: 1.318
        width: 0.107
        mass_fixed: false
        width_fixed: false
        mass_limits: [1.20, 1.45]
        width_limits: [0.05, 0.25]
        phase_reference: true  # a2(1320) phase reference (phases fixed to zero)
    init:
      strategy: "from_file"
      file_path: "logs_a2CS_dbw_kinematic/{tbin}/fit/nominal_best.root"
      shared_phase: true       # Shared phases among waves in the same reflectivity

minimizer:
  algorithm: "Minuit2"
  strategy: 1
  tolerance: 1.0e-3
  max_calls: 1000000
  print_level: 0

multi_start:
  enabled: true
  n_starts: 100
  n_threads: 20
  n_tbin_workers: 5
  output_dir: "logs_a2CS_spiecewise_dbw_kinematic"
  plateau_delta_chi2: 0.05
  seed_offset: 1

mcmc_propagation:
  enabled: true
  burn_in: 0
  max_entries: 200
  stride: 1
  n_workers: 8
  n_tbin_workers: 5
  output_file: "mcmc_propagation_spiecewise_kinematic_results.root"
  log_dir: "logs_a2CS_spiecewise_dbw_kinematic/mcmc_fits"

plotting:
  enabled: true
  style: "default"
  n_lowest_chi2: 10
  draw_best_fits: true
  distributions: true
  posterior_density_bands: true
  moments_vs_t: true
  moments: ["all"]
  formats: ["png", "pdf"]

cross_section:
  enabled: false
  resonance: "a2_1320"
  branching_ratio: 0.0565
  luminosity: 257.4
  luminosity_unit: "pb^-1"
  mass_limits: [0.8, 2.0]
  phase1_comparison: true
