[workspace]
authors = ["Nizar Septian <nizar47@gmail.com>"]
channels = ["conda-forge"]
name = "Moments"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
compile = "python -m moments2amplitudes.cli compile"
fit = "python -m moments2amplitudes.cli fit"
propagate = "python -m moments2amplitudes.cli propagate"
validate = "python -m moments2amplitudes.cli validate"
plot = "python -m moments2amplitudes.cli plot"
summary = "python -m moments2amplitudes.cli summary"
cross-section = "python -m moments2amplitudes.cli cs"
cs = "python -m moments2amplitudes.cli cs"
test = "python -m unittest discover -s tests -v"
mom2amp = "python -m moments2amplitudes.cli"

[dependencies]
# --- Core Environment ---
# Note: Pixi's python 3.9 and root 6.28 are strictly for the Python environment and linear algebra libraries.
# BruFit and Moments2Amplitudes C++ fitting engines use the system ROOT 6.36 (/d/grid17/septian/root_v6-36-08_cuda_install) and brufit_negative.
python = "3.9.*"
root = "6.28.*"

# --- The Conda-Forge Compilers ---
c-compiler = "*"
cxx-compiler = "*"
openmp = "*"

# --- Your Packages ---
bidict = "~=0.23.1"
matplotlib = "~=3.9.2"
nptyping = "~=2.5.0"
numpy = ">=1.26.4,<2"
pandas = "~=2.2.3"
scipy = "~=1.13.1"
threadpoolctl = "~=3.5.0"
uncertainties = "~=3.2.2"
wurlitzer = "~=3.1.1"
iminuit = ">=2.31.1,<3"
spherical = ">=1.0.15,<2"
pyyaml = ">=6.0"
pytest = "*"

[pypi-dependencies]
py3nj = "~=0.2.1"

[activation.env]
PYTHONNOUSERSITE = "1"
MOMS2AMPS = "${PIXI_PROJECT_ROOT}"
# BruFit directory: picks up $BRUFIT if exported, otherwise falls back to default
BRUFIT = "${BRUFIT:-/d/grid17/septian/brufit_dev/brufit_negative}"
ROOTSYS = "${ROOTSYS:-/d/grid17/septian/root_v6-36-08_cuda_install}"
ROOT_INCLUDE_PATH = "${PIXI_PROJECT_ROOT}/include:${PIXI_PROJECT_ROOT}/macros:${BRUFIT}/install/include:${BRUFIT}/core:${BRUFIT}/include:${ROOTSYS}/include:${ROOT_INCLUDE_PATH}"
PYTHONPATH = "${PIXI_PROJECT_ROOT}/python:${PYTHONPATH}"
PATH = "${ROOTSYS}/bin:${PATH}"
LD_LIBRARY_PATH = "${ROOTSYS}/lib:${BRUFIT}/install/lib64:${BRUFIT}/build/lib:${BRUFIT}/lib:${LD_LIBRARY_PATH}"
MPLCONFIGDIR = "/tmp"