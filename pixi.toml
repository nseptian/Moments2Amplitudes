[workspace]
authors = ["Nizar Septian <nizar47@gmail.com>"]
channels = ["conda-forge"]
name = "Moments"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# --- Core Environment ---
python = "3.9.*"
root = "6.28.*"

# --- The Conda-Forge Compilers ---
c-compiler = "*"
cxx-compiler = "*"
openmp = "*"

# --- Your Packages ---
bidict = "~=0.23.1"
matplotlib = "~=3.9.2"
nptyping = "~=2.5.0"
numpy = ">=1.26.4,<2"
pandas = "~=2.2.3"
scipy = "~=1.13.1"
threadpoolctl = "~=3.5.0"
uncertainties = "~=3.2.2"
wurlitzer = "~=3.1.1"
iminuit = ">=2.31.1,<3"
spherical = ">=1.0.15,<2"

[pypi-dependencies]
py3nj = "~=0.2.1"

[activation.env]
PYTHONNOUSERSITE = "1"