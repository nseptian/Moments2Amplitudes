[workspace]
authors = ["Nizar Septian <nizar47@gmail.com>"]
channels = ["conda-forge"]
name = "Moments"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
compile = "python -m moments2amplitudes.cli compile"
fit = "python -m moments2amplitudes.cli fit"
propagate = "python -m moments2amplitudes.cli propagate"
validate = "python -m moments2amplitudes.cli validate"
plot = "python -m moments2amplitudes.cli plot"
summary = "python -m moments2amplitudes.cli summary"
cross-section = "python -m moments2amplitudes.cli cs"
cs = "python -m moments2amplitudes.cli cs"
test = "python -m unittest discover -s tests -v"
mom2amp = "python -m moments2amplitudes.cli"
momentfit = "python run_momentfit.py"

[environments]
default = { features = ["py312"] }
py39 = { features = ["py39"] }

[dependencies]
# --- Shared Packages ---
c-compiler = "*"
cxx-compiler = "*"
openmp = "*"
bidict = "~=0.23.1"
matplotlib = "~=3.9.2"
numpy = ">=1.26.4"
pandas = ">=2.2.3"
scipy = ">=1.13.1"
threadpoolctl = ">=3.5.0"
wurlitzer = "~=3.1.1"
pyyaml = ">=6.0"
pytest = "*"
uproot = "*"

[pypi-dependencies]
mplhep = ">=0.3.50"

# --- Feature py312 (Default: Python 3.12 matching BruFit & ROOT 6.36) ---
[feature.py312.dependencies]
python = ">=3.12,<3.13"

[feature.py312.activation.env]
PYTHONNOUSERSITE = "1"
MOMS2AMPS = "${PIXI_PROJECT_ROOT}"
BRUFIT = "${BRUFIT:-/d/grid17/septian/brufit_dev/brufit_negative}"
ROOTSYS = "${ROOTSYS:-/d/grid17/septian/root_v6-36-08_cuda_install}"
ROOT_INCLUDE_PATH = "${PIXI_PROJECT_ROOT}/include:${PIXI_PROJECT_ROOT}/macros:${BRUFIT}/install/include:${BRUFIT}/core:${BRUFIT}/include:${ROOTSYS}/include:${ROOT_INCLUDE_PATH}"
PYTHONPATH = "${ROOTSYS}/lib:${PIXI_PROJECT_ROOT}/python:${PYTHONPATH}"
PATH = "${ROOTSYS}/bin:${PATH}"
LD_LIBRARY_PATH = "${ROOTSYS}/lib:${BRUFIT}/install/lib64:${BRUFIT}/build/lib:${BRUFIT}/lib:${LD_LIBRARY_PATH}"
MPLCONFIGDIR = "/tmp"

# --- Feature py39 (Python 3.9 + ROOT 6.28 for Linear Algebra & Moments.Main) ---
[feature.py39.dependencies]
python = "3.9.*"
root = "6.28.*"
nptyping = "~=2.5.0"
uncertainties = "~=3.2.2"
iminuit = ">=2.31.1,<3"
spherical = ">=1.0.15,<2"

[feature.py39.pypi-dependencies]
py3nj = "~=0.2.1"

[feature.py39.activation.env]
PYTHONNOUSERSITE = "1"
MOMS2AMPS = "${PIXI_PROJECT_ROOT}"
ROOTSYS = ""
PATH = "${CONDA_PREFIX}/bin:/usr/bin:/bin:${PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib"
PYTHONPATH = "${PIXI_PROJECT_ROOT}/python"
MPLCONFIGDIR = "/tmp"
